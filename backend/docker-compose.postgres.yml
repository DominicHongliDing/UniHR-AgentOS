name: unihr-agentos

services:
  workflow-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: unihr_workflows
      POSTGRES_USER: unihr
      POSTGRES_PASSWORD: ${UNIHR_POSTGRES_PASSWORD:-unihr_local_only}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - unihr-workflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unihr -d unihr_workflows"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  unihr-workflow-postgres:
